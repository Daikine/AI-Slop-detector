services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: slop-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:15
    container_name: slop-postgres
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: slop
    ports:
      - "5435:5432"

  redis:
    image: redis:7-alpine
    container_name: slop-redis
    ports:
      - "6379:6379"

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: api-gateway
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir services/api-gateway
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - kafka
      - redis

  aggregator:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: aggregator
    command: python -u services/aggregator/app/main.py
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      - kafka

  decision-engine:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: decision-engine
    command: python -u services/decision-engine/app/main.py
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      DATABASE_URL: postgresql://dev:dev@postgres:5432/slop
    depends_on:
      - kafka
      - postgres

  mock-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: api-gateway
    command: python -u tools/mock_analyzer.py
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      - kafka

  text-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: text-analyzer
    command: python -u services/text-analyzer/main.py
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      MODEL_DIR: /models/text_detector
      MODEL_VERSION: distilbert-slop-v1
    volumes:
      - ./ML/models/text_detector:/models/text_detector:ro
    depends_on:
      - kafka

  html-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: html-analyzer
    command: python -u services/html-analyzer/app/main.py
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      - kafka

  image-analyzer:
    build:
      context: .
      dockerfile: Dockerfile.service
      args:
        SERVICE: image-analyzer
    command: python -u services/image-analyzer/app/main.py
    restart: on-failure
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      - kafka
