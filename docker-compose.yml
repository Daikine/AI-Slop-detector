services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: slop-app
    ports:
      - "8000:8000"
    environment:
      IMAGE_ANALYZER_URL: http://image-analyzer:8001/analyze
      BASELINE_MODEL: /models/baseline_model.pkl
      BASELINE_VEC: /models/baseline_vectorizer.pkl
      MODEL_VERSION: baseline-tfidf-v1
    volumes:
      - ./ML/models:/models:ro
    depends_on:
      - image-analyzer
    restart: on-failure

  image-analyzer:
    build:
      context: ./image-analyzer
      dockerfile: Dockerfile
    container_name: slop-image-analyzer
    ports:
      - "8001:8001"
    environment:
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.openai.com/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    restart: on-failure
